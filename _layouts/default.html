---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}

    <style>
      /*
       * Ning Xie website, Module 2 locked visual layer
       * Clean white AcademicPages design with MSU Spartan Green accents
       */

      :root,
      html[data-theme="dark"] {
        --global-base-color: #18453B !important;
        --global-bg-color: #ffffff !important;
        --global-footer-bg-color: #ffffff !important;
        --global-border-color: #e6e9e8 !important;
        --global-dark-border-color: #cfd5d2 !important;
        --global-code-background-color: #f7f8f7 !important;
        --global-code-text-color: #333333 !important;
        --global-fig-caption-color: #666666 !important;
        --global-link-color: #18453B !important;
        --global-link-color-hover: #0f332d !important;
        --global-link-color-visited: #18453B !important;
        --global-masthead-link-color: #333333 !important;
        --global-masthead-link-color-hover: #18453B !important;
        --global-text-color: #3f4345 !important;
        --global-text-color-light: #666666 !important;
        --global-thead-color: #f5f6f5 !important;
      }

      html,
      body {
        background: #ffffff !important;
      }

      /* MSU Spartan Green for content links */
      .page__content a,
      .archive a,
      .page__meta a {
        color: #18453B !important;
      }

      .page__content a:hover,
      .archive a:hover,
      .page__meta a:hover {
        color: #0f332d !important;
      }

      /* Keep top navigation clean and neutral, green only on hover */
      .greedy-nav,
      .masthead {
        background: #ffffff !important;
      }

      .greedy-nav a {
        color: #333333 !important;
      }

      .greedy-nav a:hover {
        color: #18453B !important;
      }

      /* Remove the underline below the top-left "Ning Xie" site title */
      .masthead__menu-item--lg > a,
      .masthead__menu-item--lg > a:hover,
      .masthead__menu-item--lg > a:focus,
      .masthead__menu-item--lg.selected > a {
        border-bottom: 0 !important;
        box-shadow: none !important;
        text-decoration: none !important;
      }

      .masthead__menu-item--lg > a::before,
      .masthead__menu-item--lg > a::after,
      .masthead__menu-item--lg.selected > a::before,
      .masthead__menu-item--lg.selected > a::after {
        content: none !important;
        display: none !important;
        border: 0 !important;
      }

      /* Hide the light/dark theme gear/toggle */
      #theme-toggle,
      .theme-toggle,
      .dark_mode_btn,
      .masthead button[title*="theme" i],
      .masthead button[aria-label*="theme" i],
      .masthead i[title*="theme" i],
      .masthead i[aria-label*="theme" i] {
        display: none !important;
      }

      /* Also remove the empty navigation slot around a hidden toggle */
      .greedy-nav li:has(#theme-toggle),
      .greedy-nav li:has(.theme-toggle),
      .greedy-nav li:has(.dark_mode_btn) {
        display: none !important;
      }

      /* Fallback: footer should never render even if another layout inserts it */
      .page__footer {
        display: none !important;
      }
    </style>
  </head>

  <body>
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    {% include scripts.html %}
  </body>
</html>
